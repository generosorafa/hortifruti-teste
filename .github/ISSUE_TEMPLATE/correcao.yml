name: Correção
description: Registre erro, regressão ou comportamento incorreto de algo existente.
title: "[Correção] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Use este modelo somente para corrigir algo que já deveria funcionar."
  - type: textarea
    id: resumo
    attributes:
      label: Resumo do problema
      description: Explique o erro e o impacto para a operação.
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Informe página, dados fictícios usados e sequência de ações.
      placeholder: "1. Abra...\n2. Selecione...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: atual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      placeholder: "- [ ] O erro não ocorre mais\n- [ ] O fluxo relacionado continua funcionando"
    validations:
      required: true
  - type: textarea
    id: validacao
    attributes:
      label: Validação prevista
      description: Explique como a correção será comprovada.
    validations:
      required: true
  - type: textarea
    id: riscos
    attributes:
      label: Riscos e dados envolvidos
      description: Informe possíveis impactos em dados, Firebase, celular, impressão ou deploy.
      placeholder: Nenhum risco conhecido.
    validations:
      required: true
