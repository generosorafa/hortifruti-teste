name: Validar regras do Firebase

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "tests/firestore.rules.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-firebase-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Preparar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Testar bloqueios e autorizações
        run: npm run test:rules
