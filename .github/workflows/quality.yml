name: Esteira de qualidade

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Código, arquitetura e dependências
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar lint, tipos, arquitetura e dependências
        run: npm run quality:static

      - name: Validar mensagens dos commits do Pull Request
        if: github.event_name == 'pull_request'
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  automated-tests:
    name: Testes unitários, integração e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: error

      - name: Publicar cobertura no Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  build-and-budget:
    name: Build e orçamento de performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run performance:budget

  firestore-rules:
    name: Regras de segurança do Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Preparar Java para o emulador
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  end-to-end:
    name: Fluxos críticos no computador e celular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Guardar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  security:
    name: Dependências e revisão de segurança
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Bloquear vulnerabilidades altas ou críticas em produção
        run: npm run security:audit
      - name: Revisar novas dependências do Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Analisar código com CodeQL
        uses: github/codeql-action/analyze@v4

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - static-analysis
      - automated-tests
      - build-and-budget
      - firestore-rules
      - end-to-end
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar aprovação de toda a esteira
        shell: bash
        run: |
          results=(
            "${{ needs.static-analysis.result }}"
            "${{ needs.automated-tests.result }}"
            "${{ needs.build-and-budget.result }}"
            "${{ needs.firestore-rules.result }}"
            "${{ needs.end-to-end.result }}"
            "${{ needs.security.result }}"
          )
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "A esteira não foi aprovada: um ou mais checks falharam ou foram cancelados."
              exit 1
            fi
          done
          echo "Todos os checks obrigatórios foram aprovados."
